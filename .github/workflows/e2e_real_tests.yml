name: E2E Tests (serveur réel)

# Scénarios réels (integration_test/scenarios_real/) sur émulateur, contre un
# GeoNature + monitoring monté en Docker (.github/geonature-e2e/). Trop long
# pour chaque PR : chaque semaine, et à la main avant une release.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      geonature_image:
        description: "Image du backend GeoNature"
        default: "ghcr.io/pnx-si/geonature-backend-extra:2.17.4"

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEONATURE_IMAGE: ${{ inputs.geonature_image || 'ghcr.io/pnx-si/geonature-backend-extra:2.17.4' }}
      GEONATURE_PORT: "5000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Monter GeoNature (Docker) et les données de test
        run: .github/geonature-e2e/up.sh POPAmphibien POPReptile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Scénarios réels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Premier run : POPAmphibien, plus le scénario multi-modules.
          script: .github/geonature-e2e/run_scenarios.sh POPAmphibien,POPReptile POPReptile

      - name: Journaux GeoNature
        if: failure()
        run: docker compose -p gne2e -f .github/geonature-e2e/docker-compose.yml logs --tail 300 geonature
